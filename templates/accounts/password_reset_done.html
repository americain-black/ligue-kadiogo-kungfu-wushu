<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email envoyé — Ligue du Kadiogo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-image: url('/static/img/bg_login.png');
            background-size: cover; background-position: center;
            background-repeat: no-repeat; min-height: 100vh;
            display: flex; align-items: center; justify-content: center; position: relative;
        }
        body::before { content:''; position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:0; }
        .login-card {
            position:relative; z-index:1; background:#fff; border-radius:16px;
            box-shadow:0 20px 60px rgba(0,0,0,.4); width:100%; max-width:420px; padding:2.5rem;
        }
        .login-logo {
            width:70px;height:70px;background:linear-gradient(135deg,#198754,#146c43);
            border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;
        }
        .login-logo i{font-size:2rem;color:#fff;}
    </style>
</head>
<body>
<div class="login-card text-center">
    <div class="login-logo"><i class="bi bi-envelope-check-fill"></i></div>
    <h4 class="fw-bold mb-2">Email envoyé !</h4>
    <p class="text-muted small mb-4">
        Si un compte correspond à cette adresse email, vous recevrez un lien de réinitialisation dans quelques minutes.<br>
        Vérifiez aussi vos <strong>spams</strong>.
    </p>
    <a href="{% url 'accounts:login' %}" class="btn btn-outline-secondary w-100">
        <i class="bi bi-arrow-left me-1"></i>Retour à la connexion
    </a>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
