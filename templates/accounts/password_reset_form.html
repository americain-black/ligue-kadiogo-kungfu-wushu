{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mot de passe oublié — Ligue du Kadiogo</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'img/favicon-32x32.png' %}?v=4">
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'img/favicon-16x16.png' %}?v=4">
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'img/apple-touch-icon.png' %}?v=4">
    <link rel="shortcut icon" type="image/x-icon" href="{% static 'img/favicon.ico' %}?v=4">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-image: url('/static/img/bg_login.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            z-index: 0;
        }
        .login-card {
            position: relative;
            z-index: 1;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            width: 100%;
            max-width: 420px;
            padding: 2.5rem;
        }
        .login-logo {
            width: 70px; height: 70px;
            background: linear-gradient(135deg, #c0392b, #96281b);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 1rem;
        }
        .login-logo i { font-size: 2rem; color: #fff; }
        .form-control:focus { border-color: #c0392b; box-shadow: 0 0 0 0.2rem rgba(192,57,43,.2); }
        .btn-connexion {
            background: linear-gradient(135deg, #c0392b, #96281b);
            border: none; color: #fff;
            padding: .7rem; font-size: 1rem; font-weight: 600;
            border-radius: 8px; transition: opacity .2s;
        }
        .btn-connexion:hover { opacity: .9; color: #fff; }
    </style>
</head>
<body>
<div class="login-card">
    <div class="login-logo"><i class="bi bi-key-fill"></i></div>
    <h4 class="text-center fw-bold mb-1">Mot de passe oublié</h4>
    <p class="text-center text-muted small mb-4">
        Entrez votre adresse email. Vous recevrez un lien pour créer un nouveau mot de passe.
    </p>

    <form method="post">
        {% csrf_token %}
        <div class="mb-4">
            <label class="form-label fw-semibold small">Adresse email</label>
            <div class="input-group">
                <span class="input-group-text" style="background:#f8f9fa;border-right:none;color:#c0392b;">
                    <i class="bi bi-envelope"></i>
                </span>
                <input type="email" name="email" class="form-control" style="border-left:none;"
                       placeholder="Votre adresse email" required autofocus>
            </div>
        </div>
        <button type="submit" class="btn btn-connexion w-100">
            <i class="bi bi-send me-2"></i>Envoyer le lien
        </button>
    </form>

    <hr class="my-3">
    <p class="text-center small mb-0">
        <a href="{% url 'accounts:login' %}" class="text-decoration-none text-danger">
            <i class="bi bi-arrow-left me-1"></i>Retour à la connexion
        </a>
    </p>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
